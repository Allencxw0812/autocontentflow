name: Content Freshness Check

on:
  schedule:
    # Every Monday at 08:00 UTC+8 (00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  freshness-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run freshness check
        id: check
        run: |
          node scripts/ops.mjs check --json > reports/freshness-report.json
          cat reports/freshness-report.json

      - name: Create issue if stale content found
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('reports/freshness-report.json', 'utf-8'));

            const staleCount = (report.staleTools?.length || 0) + (report.staleScenarios?.length || 0);

            if (staleCount === 0) {
              console.log('✅ All content is fresh, no issue needed.');
              return;
            }

            const body = [
              `## 📊 Content Freshness Report`,
              `> Generated: ${report.generatedAt}`,
              `> Stale threshold: ${report.staleDaysThreshold} days`,
              ``,
              `### ⚠️ Stale Tools (${report.staleTools?.length || 0})`,
              ...(report.staleTools || []).map(t =>
                `- **${t.name}** (${t.id}) — last updated ${t.updatedAt}, **${t._ageDays} days** stale`
              ),
              ``,
              `### ⚠️ Stale Scenarios (${report.staleScenarios?.length || 0})`,
              ...(report.staleScenarios || []).map(s =>
                `- **${s.name}** (${s.id}) — last updated ${s.updatedAt}, **${s._ageDays} days** stale`
              ),
              ``,
              `### Recommended Actions`,
              `1. Run \`node scripts/ops.mjs refresh\` to AI-refresh stale content`,
              `2. Or manually update the above tools/scenarios`,
              `3. Close this issue when all content is fresh`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Content Freshness Report — ${staleCount} items need update`,
              body,
              labels: ['content', 'automated'],
            });

            console.log(`Issue created for ${staleCount} stale items.`);
